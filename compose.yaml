services:
  relay:
    build: .
    restart: unless-stopped
    volumes:
      - relay-data:/data
    expose:
      - "4318"
    environment:
      - RELAY_SETUP_SECRET=${RELAY_SETUP_SECRET:?Set a random setup secret of at least 24 characters}
    mem_limit: 1g
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RELAY_DOMAIN=${RELAY_DOMAIN:?Set your DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
volumes:
  relay-data:
  caddy-data:
  caddy-config:
