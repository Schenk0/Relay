name: Relay
options:
  bundleIdPrefix: ${RELAY_BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_RelayAppGroup: group.${RELAY_BUNDLE_ID_PREFIX}
    INFOPLIST_KEY_RelayKeychainGroup: $(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared
    INFOPLIST_KEY_RelayDefaultServer: ${RELAY_DEFAULT_SERVER}
    CODE_SIGN_STYLE: Automatic
    REGISTER_APP_GROUPS: YES
    DEVELOPMENT_TEAM: "${RELAY_APPLE_TEAM}"
targets:
  RelayMac:
    type: application
    platform: macOS
    sources: [Sources/RelayApp, Sources/RelayCore, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RELAY_BUNDLE_ID_PREFIX}.mac
        PRODUCT_NAME: Relay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELAY_APP
        INFOPLIST_KEY_RelayAppGroup: $(DEVELOPMENT_TEAM).${RELAY_BUNDLE_ID_PREFIX}
    entitlements:
      path: Config/Mac.entitlements
      properties:
        keychain-access-groups:
          ["$(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared"]
        com.apple.security.application-groups:
          ["$(DEVELOPMENT_TEAM).${RELAY_BUNDLE_ID_PREFIX}"]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    dependencies:
      - target: RelayMacShare
        embed: true
  RelayIOS:
    type: application
    platform: iOS
    sources: [Sources/RelayApp, Sources/RelayCore, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RELAY_BUNDLE_ID_PREFIX}.ios
        PRODUCT_NAME: Relay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_RelayKeychainGroup: $(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Relay service on your local network.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELAY_APP
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.security.application-groups:
          ["group.${RELAY_BUNDLE_ID_PREFIX}"]
        keychain-access-groups:
          ["$(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared"]
    dependencies:
      - target: RelayIOSShare
        embed: true
  RelayIOSShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Sources/RelayCore]
    info:
      path: Config/iOSShare-Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RelayAppGroup: group.${RELAY_BUNDLE_ID_PREFIX}
        RelayKeychainGroup: $(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RELAY_BUNDLE_ID_PREFIX}.ios.share
        SKIP_INSTALL: YES
    entitlements:
      path: Config/iOSShare.entitlements
      properties:
        com.apple.security.application-groups:
          ["group.${RELAY_BUNDLE_ID_PREFIX}"]
        keychain-access-groups:
          ["$(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared"]
  RelayMacShare:
    type: app-extension
    platform: macOS
    sources: [ShareExtension, Sources/RelayCore]
    info:
      path: Config/MacShare-Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RelayAppGroup: $(DEVELOPMENT_TEAM).${RELAY_BUNDLE_ID_PREFIX}
        RelayKeychainGroup: $(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RELAY_BUNDLE_ID_PREFIX}.mac.share
        SKIP_INSTALL: YES
    entitlements:
      path: Config/MacShare.entitlements
      properties:
        keychain-access-groups:
          ["$(AppIdentifierPrefix)${RELAY_BUNDLE_ID_PREFIX}.shared"]
        com.apple.security.application-groups:
          ["$(DEVELOPMENT_TEAM).${RELAY_BUNDLE_ID_PREFIX}"]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
