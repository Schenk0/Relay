name: Relay
options:
  bundleIdPrefix: org.example.relay
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_RelayAppGroup: group.org.example.relay
    INFOPLIST_KEY_RelayKeychainGroup: $(AppIdentifierPrefix)org.example.relay.shared
    CODE_SIGN_STYLE: Automatic
    REGISTER_APP_GROUPS: YES
    DEVELOPMENT_TEAM: 
targets:
  RelayMac:
    type: application
    platform: macOS
    sources: [Sources/RelayApp, Sources/RelayCore, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.mac
        PRODUCT_NAME: Relay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELAY_APP
        INFOPLIST_KEY_RelayAppGroup: $(DEVELOPMENT_TEAM).org.example.relay
    entitlements:
      path: Config/Mac.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)org.example.relay.shared]
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).org.example.relay]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    dependencies:
      - target: RelayMacShare
        embed: true
  RelayIOS:
    type: application
    platform: iOS
    sources: [Sources/RelayApp, Sources/RelayCore, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.ios
        PRODUCT_NAME: Relay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_RelayKeychainGroup: $(AppIdentifierPrefix)org.example.relay.shared
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Relay service on your local network.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELAY_APP
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.org.example.relay]
        keychain-access-groups: [$(AppIdentifierPrefix)org.example.relay.shared]
    dependencies:
      - target: RelayIOSShare
        embed: true
  RelayIOSShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Sources/RelayCore]
    info:
      path: Config/iOSShare-Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RelayAppGroup: group.org.example.relay
        RelayKeychainGroup: $(AppIdentifierPrefix)org.example.relay.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.ios.share
        SKIP_INSTALL: YES
    entitlements:
      path: Config/iOSShare.entitlements
      properties:
        com.apple.security.application-groups: [group.org.example.relay]
        keychain-access-groups: [$(AppIdentifierPrefix)org.example.relay.shared]
  RelayMacShare:
    type: app-extension
    platform: macOS
    sources: [ShareExtension, Sources/RelayCore]
    info:
      path: Config/MacShare-Info.plist
      properties:
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RelayAppGroup: $(DEVELOPMENT_TEAM).org.example.relay
        RelayKeychainGroup: $(AppIdentifierPrefix)org.example.relay.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.relay.mac.share
        SKIP_INSTALL: YES
    entitlements:
      path: Config/MacShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)org.example.relay.shared]
        com.apple.security.application-groups: [$(DEVELOPMENT_TEAM).org.example.relay]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
