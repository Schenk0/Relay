name: relay
services:
  relay:
    build: .
    image: relay:local
    environment:
      RELAY_TRUSTED_PROXIES: "loopback,uniquelocal,203.0.113.20/32"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4318/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  relay-data:
    name: relay-data
