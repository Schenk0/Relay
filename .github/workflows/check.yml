name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-and-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm privacy:check --history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test:config && pnpm typecheck && pnpm test:service && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: brew install xcodegen
      - run: pnpm apple:generate
      - run: xcodebuild -project apps/apple/Relay.xcodeproj -scheme RelayMac -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project apps/apple/Relay.xcodeproj -scheme RelayIOS -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
